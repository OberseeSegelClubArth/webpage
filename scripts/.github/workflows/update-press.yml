name: Update OSCA Press Widget

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run update

      - name: Commit updated press data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/press.json
          git commit -m "Update OSCA press data" || echo "No changes"
          git push
