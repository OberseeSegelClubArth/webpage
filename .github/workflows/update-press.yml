name: Update OSCA Press Widget

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run OSCA scraper
        run: npm run update

      - name: Commit updated press data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/press.json docs/cards.html
          git commit -m "Update OSCA press data" || echo "No changes to commit"
          git push
