<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSCA in den Medien</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #222;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #222;
    }
    
    .status {
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
    }
    
    .status.loading {
      color: #0066cc;
    }
    
    .status.error {
      color: #d32f2f;
      background: #ffebee;
      padding: 12px;
      border-radius: 8px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
    }
    
    .card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      transform: translateY(-4px);
    }
    
    .card-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 48px;
      font-weight: 300;
      overflow: hidden;
    }
    
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-image.pdf {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    
    .card-image.clubdesk {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    
    .card-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
      color: #222;
    }
    
    .card-type {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .card-button {
      margin-top: auto;
      padding: 8px 0;
      color: #0066cc;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: color 0.2s;
    }
    
    .card-button:hover {
      color: #0052a3;
    }
    
    .card-button::after {
      content: ' →';
      margin-left: 4px;
    }
    
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }
      
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      
      .card-image {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA in den Medien</h1>
    <div id="status" class="status loading">Wird geladen...</div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    async function loadPressFiles() {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('grid');
      
      try {
        const response = await fetch('press.json');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = response.json();
        
        // Wait for the promise to resolve
        const pressData = await data;
        
        if (!pressData.files || pressData.files.length === 0) {
          statusEl.innerHTML = `Zuletzt aktualisiert: ${new Date(pressData.lastUpdated).toLocaleString('de-CH')}`;
          statusEl.className = 'status';
          gridEl.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>Keine Pressemitteilungen verfügbar</p></div>';
          return;
        }
        
        gridEl.innerHTML = '';
        pressData.files.forEach(file => {
          const card = createCard(file);
          gridEl.appendChild(card);
        });
        
        statusEl.innerHTML = `${pressData.files.length} Artikel · Zuletzt aktualisiert: ${new Date(pressData.lastUpdated).toLocaleString('de-CH')}`;
        statusEl.className = 'status';
        
      } catch (error) {
        console.error('Error loading press files:', error);
        statusEl.innerHTML = `⚠️ Fehler beim Laden: ${error.message}`;
        statusEl.className = 'status error';
        gridEl.innerHTML = '';
      }
    }
    
    function createCard(file) {
      const card = document.createElement('a');
      card.href = file.url;
      card.target = '_blank';
      card.className = 'card';
      card.rel = 'noopener noreferrer';
      
      const isImage = file.type === 'image';
      const isPDF = file.type === 'pdf';
      const isClubDesk = file.type === 'clubdesk';
      
      let imageHTML = '';
      let typeLabel = '';
      
      if (isImage) {
        imageHTML = `<img src="${escapeHtml(file.url)}" alt="${escapeHtml(file.title)}" loading="lazy">`;
        typeLabel = 'Bild';
      } else if (isPDF) {
        imageHTML = '<div style="font-size: 60px;">📄</div>';
        typeLabel = 'PDF-Datei';
      } else if (isClubDesk) {
        imageHTML = '<div style="font-size: 60px;">📎</div>';
        typeLabel = 'ClubDesk-Datei';
      }
      
      card.innerHTML = `
        <div class="card-image ${isPDF ? 'pdf' : isClubDesk ? 'clubdesk' : ''}">
          ${imageHTML}
        </div>
        <div class="card-content">
          <div class="card-type">${typeLabel}</div>
          <div class="card-title">${escapeHtml(file.title)}</div>
          <div class="card-button">Öffnen</div>
        </div>
      `;
      
      return card;
    }
    
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
    
    // Load press files when page loads
    document.addEventListener('DOMContentLoaded', loadPressFiles);
  </script>
</body>
</html>
